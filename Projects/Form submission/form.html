<!DOCTYPE html>
<html>
<head>
  <title>Form Validation</title>
  <link rel="stylesheet" href="form.css">
</head>
<body>

<form onsubmit="return validateForm()">

  Name: <input type="text" id="name"><br><br>

  Email: <input type="text" id="email"><br><br>

  Phone: <input type="text" id="phone"><br><br>

  Password: <input type="password" id="pass"><br><br>

  Confirm Password: <input type="password" id="cpass"><br><br>

  Gender:
  <input type="radio" name="gender" value="male"> Male
  <input type="radio" name="gender" value="female"> Female
  <br><br>

  Skills:
  <input type="checkbox" name="skill"> HTML
  <input type="checkbox" name="skill"> CSS
  <input type="checkbox" name="skill"> JS
  <br><br>

  <input type="submit" value="Submit">

</form>

<script src="form.js"></script>

</body>
</html>
